name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find and Build Plugin
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan!"
            exit 1
          fi

          echo "Menggunakan: $POM"
          mvn -B -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1
          path: '**/target/*.jar'
          if-no-files-found: error
